name: Telegram Digest (4x daily)
# 재발 방지 (2026-08 좀비 런 사태 이후):
#   1) cancel-in-progress: true → 좀비 런이 슬롯을 잡아도 다음 스케줄이 대체
#   2) timeout-minutes: 10 → GitHub 레벨 강제 종료
#   3) timeout -k 30 480 → OS 레벨에서 8분 후 프로세스 강제 종료 (GitHub 타임아웃 실패 대비)
#      단발 실행이므로 타임아웃 = 실패로 간주 → 알림 발송됨 (상주 봇과 다름)
on:
  schedule:
    # KST 08:00 / 12:00 / 16:00 / 22:00  →  UTC 23:00(전일) / 03:00 / 07:00 / 13:00
    - cron: "0 23 * * *"
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # 수동 실행 테스트용
permissions:
  contents: write         # state.json 커밋용
concurrency:
  group: telegram-digest
  cancel-in-progress: true   # ★ 핵심 수정: 좀비 런 자동 대체
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5      # v4 → v5
      - uses: actions/setup-python@v6  # v5 → v6
        with:
          python-version: "3.12"
      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SOURCE_CHAT_ID: ${{ secrets.SOURCE_CHAT_ID }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # OS 레벨 방어선: 480초(8분) 후 SIGTERM, 30초 내 미종료 시 SIGKILL
        run: timeout -k 30 480 python digest.py
      - name: Commit state checkpoint
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add state.json || true
          git add digests/ || true
          git diff --cached --quiet || git commit -m "chore: state + digest [skip ci]"
          git pull --rebase --autostash || true
          git push || true
      - name: Failure alert to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TARGET_CHAT_ID}" \
            --data-urlencode text="⚠️ 텔레방 요약 워크플로 실패: ${{ github.workflow }} / run ${{ github.run_id }}"
